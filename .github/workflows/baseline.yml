# SPDX-License-Identifier: Apache-2.0
# Measures a kernel commit with scripts/metrics.py and prints the table to the job summary.
# Run it by hand at the start of an engagement, against the commit hashes in
# reports/<id>/targets.lock.json.
name: baseline

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Commit hash of NON-OS/microkernel to measure
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: measure ${{ inputs.kernel_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
          path: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
          repository: NON-OS/microkernel
          ref: ${{ inputs.kernel_ref }}
          path: kernel
      - name: Measure
        env:
          KERNEL_REF: ${{ inputs.kernel_ref }}
        run: |
          set -euo pipefail
          if ! [[ "$KERNEL_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "kernel_ref must be a full 40 character commit hash" >&2
            exit 1
          fi
          {
            echo "## Baseline for $KERNEL_REF"
            echo
            python3 audit/scripts/metrics.py kernel
          } >> "$GITHUB_STEP_SUMMARY"
